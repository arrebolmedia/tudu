name: tudu-app
services:
- name: web
  source_dir: /
  github:
    repo: arrebolmedia/tudu
    branch: auth
  run_command: npm start
  build_command: npm run build
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  envs:
  - key: NODE_ENV
    value: production
  - key: NEXTAUTH_SECRET
    value: ${NEXTAUTH_SECRET}
  - key: NEXTAUTH_URL
    value: ${APP_URL}
  - key: DATABASE_URL
    value: ${tudu-db.DATABASE_URL}
  http_port: 3000

databases:
- name: tudu-db
  engine: PG
  version: "15"
  size: db-s-dev-database
